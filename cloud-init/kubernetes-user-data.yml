#cloud-config
hostname: ${hostname}
users:
  - name: ${guest_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}
bootcmd:
  - mkdir -p ${apt_key_dir}
  - apt-get update
  - apt-get install -y --no-install-recommends gnupg
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/${kubernetes_version}/deb/Release.key | gpg --dearmor -o ${apt_key_dir}k8s-key.gpg
  - curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/${kubernetes_version}/deb/Release.key | gpg --dearmor -o ${apt_key_dir}cri-o-key.gpg
apt:
  sources:
    kubernetes:
      source: "deb [signed-by=${apt_key_dir}k8s-key.gpg] https://pkgs.k8s.io/core:/stable:/${kubernetes_version}/deb/ /"
    cri-o:
      source: "deb [signed-by=${apt_key_dir}cri-o-key.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/${kubernetes_version}/deb/ /"
package_update: true
packages:
  - apt-transport-https
  - ca-certificates
  - cri-o
  - curl
  - kubeadm
  - kubelet
  %{ if is_first_node }
  - kubectl
  %{ endif }
runcmd:
  # Disable Swap
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab

  # Set up Networking
  - modprobe br_netfilter
  - echo 'br_netfilter' | sudo tee /etc/modules-load.d/br_netfilter.conf
  - echo 'net.ipv4.ip_forward=1' | sudo tee /etc/sysctl.d/99-kubernetes.conf
  - echo 'net.bridge.bridge-nf-call-iptables=1' | sudo tee -a /etc/sysctl.d/99-kubernetes.conf
  - sudo sysctl --system

  # Enable CRI-O
  - sudo apt-mark hold cri-o
  - sudo systemctl enable --now crio

  # Enable Kubelet
  - sudo apt-mark hold kubelet
  - sudo systemctl enable --now kubelet

  %{ if is_first_node }
  # Initialise Cluster
  - sudo kubeadm init --pod-network-cidr=10.244.0.0/16 --cri-socket=unix:///var/run/crio/crio.sock

  # Move kubeconfig to user
  - mkdir -p "/home/${guest_username}/.kube"
  - sudo cp "/etc/kubernetes/admin.conf" "/home/${guest_username}/.kube/config"
  - sudo chown -R "${guest_username}:${guest_username}" "/home/${guest_username}/.kube"

  # Set up pod network
  - runuser -l '${guest_username}' -c 'kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml'
  %{ endif }
